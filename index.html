<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Game Độc Lạ - Lớp 8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b132b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            height: 650px;
            background: linear-gradient(to bottom, #1d3557, #134e5e);
            border-radius: 20px;
            border: 3px solid #00fff0;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,255,240,0.4);
        }

        /* TRANG CHỦ */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        #home-screen h1 {
            font-size: 24px;
            color: #00fff0;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #home-screen p {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 35px;
            line-height: 1.5;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            padding: 0 10px;
        }
        .btn-open {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
        .btn-open:active {
            transform: scale(0.95);
        }

        /* TRANG CHỌN NHÂN VẬT */
        #char-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        #char-screen h2 {
            font-size: 20px;
            color: #ffeb3b;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .char-container {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-bottom: 15px;
        }
        .char-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00fff0;
            border-radius: 12px;
            width: 48%;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-box {
            position: relative;
            width: 100px;
            height: 140px;
            margin-bottom: 10px;
        }
        .body-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Hiệu ứng đầu lắc lư */
        @keyframes headShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }
        .face-animated {
            position: absolute;
            animation: headShake 2.5s ease-in-out infinite;
            transform-origin: bottom center;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .face-char1 { top: 12px; left: 28px; width: 44px; height: 44px; }
        .face-char2 { top: 18px; left: 28px; width: 44px; height: 44px; }

        .btn-select {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TRANG CHỦ -->
        <div id="home-screen">
            <h1>THẾ GIỚI CỦA TÔI</h1>
            <p>Hello xin chào! Đã tới với thế giới game độc quyền đỉnh cao lớp 8.</p>
            <button class="btn-open" onclick="goToCharacterSelect()">OPEN</button>
        </div>

        <!-- TRANG CHỌN NHÂN VẬT -->
        <div id="char-screen">
            <h2>CHỌN NHÂN VẬT</h2>
            
            <div class="char-container">
                <!-- Nhân vật 1 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat1.png" alt="Lực sĩ" class="body-img">
                        <img src="khuonmat1.png" alt="Mặt 1" class="face-animated face-char1">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Lực Sĩ')">CHỌN</button>
                </div>

                <!-- Nhân vật 2 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat2.png" alt="Nghèo khổ" class="body-img">
                        <img src="khuonmat2.png" alt="Mặt 2" class="face-animated face-char2">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Đói Khổ')">CHỌN</button>
                </div>
            </div>
            
            <p style="font-size: 12px; color: #fff; font-weight: bold;">Chạm nút CHỌN bên dưới để bắt đầu!</p>
        </div>
    </div>

    <script>
        function goToCharacterSelect() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('char-screen').style.display = 'flex';
        }

        function selectChar(charName) {
            alert("Bạn đã chọn: " + charName + "! Game chuẩn bị khởi chạy...");
        }
    </script>
</body>
</html>
