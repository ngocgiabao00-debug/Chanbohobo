<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Game Độc Lạ - Lớp 8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 750px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* --- BACKGROUND TRANG CHỦ: BIỂN, TRĂNG VÀ CHIM BAY --- */
        .home-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            z-index: 0;
            overflow: hidden;
            border-radius: 20px;
        }
        /* Mặt trăng lung linh */
        .moon {
            position: absolute;
            top: 40px; right: 40px;
            width: 50px; height: 50px;
            background: #f6d365;
            border-radius: 50%;
            box-shadow: 0 0 25px #f6d365;
        }
        /* Sóng biển động phía dưới */
        .sea-waves {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 120px;
            background: linear-gradient(to top, #005c97, transparent);
            border-radius: 0 0 20px 20px;
        }
        /* Đàn chim vỗ cánh hoạt họa */
        .bird-home {
            position: absolute;
            width: 16px; height: 10px;
            border-top: 3px solid #ffffff;
            border-radius: 50% 50% 0 0;
            animation: flyBird 6s linear infinite;
        }
        .bird-home:nth-child(3) { top: 80px; left: -20px; animation-delay: 0s; }
        .bird-home:nth-child(4) { top: 120px; left: -50px; animation-delay: 2.5s; }
        
        @keyframes flyBird {
            0% { transform: translateX(-30px) translateY(0) scale(0.8); opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translateX(430px) translateY(-30px) scale(1.2); opacity: 0; }
        }

        /* NỘI DUNG TRANG CHỦ (Hiển thị nổi lên trên nền) */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            z-index: 5;
            position: relative;
        }
        #home-screen h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #00fff0;
            text-shadow: 0 0 12px rgba(0,255,240,0.8);
            font-weight: bold;
        }
        #home-screen p {
            font-size: 16px;
            margin-bottom: 35px;
            line-height: 1.5;
            padding: 0 15px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .btn-play {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 198, 255, 0.6);
            transition: 0.2s;
            letter-spacing: 1px;
        }
        .btn-play:active {
            transform: scale(0.95);
        }

        /* --- TRANG CHỌN NHÂN VẬT --- */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .nature-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #134e5e, #71b280);
            z-index: 0;
            overflow: hidden;
            border-radius: 20px;
        }

        /* Dòng nước suối lấp lánh chuyển động */
        .flowing-water {
            position: absolute;
            bottom: 0; left: 0; width: 200%; height: 80px;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.15), rgba(255,255,255,0.15) 20px, transparent 20px, transparent 40px);
            animation: waterMove 4s linear infinite;
        }
        @keyframes waterMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Máy bay bay ngang */
        .airplane-anim {
            position: absolute;
            top: 50px;
            left: -60px;
            font-size: 28px;
            animation: flyPlane 10s linear infinite;
            z-index: 1;
        }
        @keyframes flyPlane {
            0% { transform: translateX(0) translateY(0) rotate(5deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(460px) translateY(-20px) rotate(-5deg); opacity: 0; }
        }

        /* Chim bay qua trang chọn nhân vật */
        .bird-char {
            position: absolute;
            top: 90px;
            left: -30px;
            width: 18px; height: 10px;
            border-top: 3px solid #ffeb3b;
            border-radius: 50% 50% 0 0;
            animation: flyBirdChar 7s linear infinite;
            animation-delay: 1s;
            z-index: 1;
        }
        @keyframes flyBirdChar {
            0% { transform: translateX(0) translateY(0); opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translateX(430px) translateY(-40px); opacity: 0; }
        }

        .screen h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ffeb3b;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .char-container {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-bottom: 15px;
            z-index: 5;
        }

        .char-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00fff0;
            border-radius: 15px;
            width: 46%;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .avatar-box {
            position: relative;
            width: 110px;
            height: 150px;
            margin-bottom: 10px;
        }

        .body-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Hiệu ứng đầu lắc lư nhịp nhàng */
        @keyframes headShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }

        .face-animated {
            position: absolute;
            animation: headShake 2.5s ease-in-out infinite;
            transform-origin: bottom center;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
            z-index: 6;
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }

        .face-char1 {
            top: 15px;
            left: 32px;
            width: 45px;
            height: 45px;
        }

        .face-char2 {
            top: 20px;
            left: 33px;
            width: 44px;
            height: 44px;
        }

        .btn-select {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
        .btn-select:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TRANG CHỦ -->
        <div id="home-screen">
            <div class="home-bg">
                <div class="moon"></div>
                <div class="sea-waves"></div>
                <div class="bird-home"></div>
                <div class="bird-home"></div>
            </div>
            <h1>THẾ GIỚI CỦA TÔI</h1>
            <p>Hello xin chào! Đã tới với thế giới game độc quyền đỉnh cao lớp 8.</p>
            <!-- Nút bấm đã sửa thành duy nhất chữ OPEN -->
            <button class="btn-play" onclick="goToCharacterSelect()">OPEN</button>
        </div>

        <!-- TRANG CHỌN NHÂN VẬT -->
        <div id="char-screen" class="screen">
            <div class="nature-bg">
                <div class="flowing-water"></div>
                <div class="airplane-anim">✈️</div>
                <div class="bird-char"></div>
            </div>

            <h2>CHỌN NHÂN VẬT</h2>
            
            <div class="char-container">
                <!-- Nhân vật 1 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat1.png" alt="Lực sĩ" class="body-img">
                        <img src="khuonmat1.png" alt="Mặt 1" class="face-animated face-char1">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Lực Sĩ')">CHỌN</button>
                </div>

                <!-- Nhân vật 2 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat2.png" alt="Nghèo khổ" class="body-img">
                        <img src="khuonmat2.png" alt="Mặt 2" class="face-animated face-char2">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Đói Khổ')">CHỌN</button>
                </div>
            </div>
            
            <p style="font-size: 13px; color: #fff; z-index: 5; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Chạm nút CHỌN bên dưới để bắt đầu!</p>
        </div>
    </div>

    <script>
        function goToCharacterSelect() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('char-screen').style.display = 'flex';
        }

        function selectChar(charName) {
            alert("Bạn đã chọn: " + charName + "! Game chuẩn bị khởi chạy...");
        }
    </script>
</body>
</html>
