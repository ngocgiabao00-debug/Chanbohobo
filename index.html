<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thế Giới Game Độc Lạ - Lớp 8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* KHUNG GAME DÀNH CHO MÀN HÌNH ĐIỆN THOẠI */
        .container {
            width: 92%;
            max-width: 380px;
            height: 90vh;
            background: rgba(15, 23, 42, 0.85);
            border-radius: 20px;
            border: 2px solid #00fff0;
            box-shadow: 0 0 20px rgba(0, 255, 240, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* NỀN ĐỘNG TRANG CHỦ */
        .home-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0d1b2a, #1b263b, #415a77);
            z-index: 1;
        }
        .moon {
            position: absolute;
            top: 30px; right: 30px;
            width: 45px; height: 45px;
            background: #f6d365;
            border-radius: 50%;
            box-shadow: 0 0 20px #f6d365;
        }
        .sea-waves {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 25%;
            background: linear-gradient(to top, #1d3557, transparent);
        }
        
        /* CHIM BAY LƯỢN HOẠT HỌA */
        .bird {
            position: absolute;
            width: 14px; height: 8px;
            border-top: 3px solid #ffffff;
            border-radius: 50% 50% 0 0;
            animation: flyBird 6s linear infinite;
            z-index: 2;
        }
        .bird1 { top: 70px; left: -20px; animation-delay: 0s; }
        .bird2 { top: 110px; left: -40px; animation-delay: 2.5s; }
        @keyframes flyBird {
            0% { transform: translateX(-30px) translateY(0); opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translateX(400px) translateY(-30px); opacity: 0; }
        }

        /* NỘI DUNG TRANG CHỦ (HIỂN THỊ NỔI NGHỆU) */
        #home-screen {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #home-screen h1 {
            font-size: 24px;
            color: #00fff0;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 240, 0.8);
        }
        #home-screen p {
            font-size: 15px;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        .btn-play {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 198, 255, 0.5);
        }
        .btn-play:active {
            transform: scale(0.95);
        }

        /* TRANG CHỌN NHÂN VẬT */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .nature-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #134e5e, #71b280);
            z-index: 1;
        }
        .flowing-water {
            position: absolute;
            bottom: 0; left: 0; width: 200%; height: 60px;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.15), rgba(255,255,255,0.15) 15px, transparent 15px, transparent 30px);
            animation: waterMove 3s linear infinite;
        }
        @keyframes waterMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .airplane-anim {
            position: absolute;
            top: 40px; left: -50px;
            font-size: 24px;
            animation: flyPlane 8s linear infinite;
            z-index: 2;
        }
        @keyframes flyPlane {
            0% { transform: translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(420px); opacity: 0; }
        }

        .screen h2 {
            font-size: 20px;
            color: #ffeb3b;
            margin-bottom: 20px;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .char-container {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            z-index: 10;
            margin-bottom: 15px;
        }
        .char-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00fff0;
            border-radius: 12px;
            width: 48%;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-box {
            position: relative;
            width: 100px;
            height: 140px;
            margin-bottom: 10px;
        }
        .body-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        @keyframes headShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }
        .face-animated {
            position: absolute;
            animation: headShake 2.5s ease-in-out infinite;
            transform-origin: bottom center;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
            z-index: 12;
        }
        .face-char1 { top: 12px; left: 28px; width: 44px; height: 44px; }
        .face-char2 { top: 18px; left: 28px; width: 44px; height: 44px; }

        .btn-select {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TRANG CHỦ -->
        <div id="home-screen">
            <div class="home-bg">
                <div class="moon"></div>
                <div class="sea-waves"></div>
                <div class="bird bird1"></div>
                <div class="bird bird2"></div>
            </div>
            
            <h1>THẾ GIỚI CỦA TÔI</h1>
            <p>Hello xin chào! Đã tới với thế giới game độc quyền đỉnh cao lớp 8.</p>
            <button class="btn-play" onclick="goToCharacterSelect()">OPEN</button>
        </div>

        <!-- TRANG CHỌN NHÂN VẬT -->
        <div id="char-screen" class="screen">
            <div class="nature-bg">
                <div class="flowing-water"></div>
                <div class="airplane-anim">✈️</div>
            </div>

            <h2>CHỌN NHÂN VẬT</h2>
            
            <div class="char-container">
                <!-- Nhân vật 1 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat1.png" alt="Lực sĩ" class="body-img">
                        <img src="khuonmat1.png" alt="Mặt 1" class="face-animated face-char1">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Lực Sĩ')">CHỌN</button>
                </div>

                <!-- Nhân vật 2 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat2.png" alt="Nghèo khổ" class="body-img">
                        <img src="khuonmat2.png" alt="Mặt 2" class="face-animated face-char2">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Đói Khổ')">CHỌN</button>
                </div>
            </div>
            
            <p style="font-size: 12px; color: #fff; z-index: 10; font-weight: bold;">Chạm nút CHỌN bên dưới để bắt đầu!</p>
        </div>
    </div>

    <script>
        function goToCharacterSelect() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('char-screen').style.display = 'flex';
        }

        function selectChar(charName) {
            alert("Bạn đã chọn: " + charName + "! Game chuẩn bị khởi chạy...");
        }
    </script>
</body>
</html>
