<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thế Giới Game Độc Lạ - Lớp 8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b132b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* KHUNG KHUNG CẢNH BÊN TRONG CONTAINER */
        .container {
            width: 100%;
            max-width: 380px;
            height: 650px;
            border-radius: 20px;
            border: 3px solid #00fff0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,255,240,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- BỐI CẢNH NỀN: BẦU TRỜI, MẶT ĐẤT & BIỂN --- */
        .view-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #4ea8de 0%, #90e0ef 50%, #caf0f8 100%);
            z-index: 1;
        }

        /* Biển xanh ở phía dưới */
        .sea {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35%;
            background: linear-gradient(to bottom, #0077b6, #023e8a);
            z-index: 2;
        }

        /* Dải đất / Bờ biển ở giữa (giao giữa bầu trời và biển) */
        .land {
            position: absolute;
            bottom: 30%; left: -10%; width: 120%; height: 80px;
            background: #2b9348;
            border-radius: 50% 50% 0 0;
            border-top: 8px solid #55a630;
            z-index: 3;
        }

        /* --- CÁC HIỆU ỨNG ĐỘNG (MÂY, CHIM VỖ CÁNH, MÁY BAY) --- */
        
        /* 1. MÂY TRÔI */
        .cloud {
            position: absolute;
            background: #ffffff;
            border-radius: 50px;
            opacity: 0.85;
            z-index: 4;
            animation: moveCloud linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
        }
        .cloud1 {
            width: 80px; height: 26px; top: 40px; left: -100px;
            animation-duration: 12s;
        }
        .cloud1::before { width: 35px; height: 35px; top: -15px; left: 12px; }
        .cloud1::after { width: 25px; height: 25px; top: -10px; right: 12px; }

        .cloud2 {
            width: 100px; height: 30px; top: 90px; left: -120px;
            animation-duration: 18s; animation-delay: 4s;
        }
        .cloud2::before { width: 45px; height: 45px; top: -20px; left: 15px; }
        .cloud2::after { width: 30px; height: 30px; top: -12px; right: 15px; }

        @keyframes moveCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(520px); }
        }

        /* 2. CHIM VỖ CÁNH BAY */
        .bird-wrapper {
            position: absolute;
            z-index: 5;
            animation: flyAcross 9s linear infinite;
        }
        .bird1-pos { top: 70px; left: -50px; animation-delay: 1s; }
        .bird2-pos { top: 120px; left: -50px; animation-delay: 5s; }

        /* Khung xương cánh chim nhấp nháy vỗ cánh */
        .bird-wings {
            width: 18px;
            height: 12px;
            border-top: 3px solid #111;
            border-left: 3px solid #111;
            transform: rotate(45deg);
            animation: flapWings 0.4s ease-in-out infinite alternate;
        }
        @keyframes flapWings {
            0% { transform: rotate(20deg) scaleY(1); }
            100% { transform: rotate(70deg) scaleY(0.4); }
        }
        @keyframes flyAcross {
            0% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(230px) translateY(-15px); }
            100% { transform: translateX(460px) translateY(5px); }
        }

        /* 3. MÁY BAY BAY NGANG */
        .airplane {
            position: absolute;
            top: 35px; left: -60px;
            font-size: 26px;
            z-index: 5;
            animation: flyPlane 14s linear infinite;
            animation-delay: 2s;
        }
        @keyframes flyPlane {
            0% { transform: translateX(0) rotate(2deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(480px) rotate(-2deg); opacity: 0; }
        }

        /* --- HIỂN THỊ NỘI DUNG (TRANG CHỦ & CHỌN NHÂN VẬT) --- */
        #home-screen, #char-screen {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
        }

        #home-screen h1 {
            font-size: 26px;
            color: #00fff0;
            margin-bottom: 15px;
            text-shadow: 0 2px 6px #000;
        }
        #home-screen p {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 35px;
            line-height: 1.5;
            text-shadow: 0 2px 4px #000;
        }
        .btn-open {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.5);
        }
        .btn-open:active {
            transform: scale(0.95);
        }

        /* MÀN HÌNH CHỌN NHÂN VẬT */
        #char-screen {
            display: none;
        }
        #char-screen h2 {
            font-size: 22px;
            color: #ffeb3b;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px #000;
        }
        .char-container {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-bottom: 15px;
        }
        .char-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00fff0;
            border-radius: 12px;
            width: 48%;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-box {
            position: relative;
            width: 100px;
            height: 140px;
            margin-bottom: 10px;
        }
        .body-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Hiệu ứng đầu lắc lư */
        @keyframes headShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }
        .face-animated {
            position: absolute;
            animation: headShake 2.5s ease-in-out infinite;
            transform-origin: bottom center;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .face-char1 { top: 12px; left: 28px; width: 44px; height: 44px; }
        .face-char2 { top: 18px; left: 28px; width: 44px; height: 44px; }

        .btn-select {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HỌA TIẾT BẢO CẢNH (NỀN BIỂN, ĐẤT, MÂY, CHIM, MÁY BAY) -->
        <div class="view-bg"></div>
        <div class="land"></div>
        <div class="sea"></div>
        
        <!-- Mây bay -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <!-- Chim vỗ cánh bay -->
        <div class="bird-wrapper bird1-pos"><div class="bird-wings"></div></div>
        <div class="bird-wrapper bird2-pos"><div class="bird-wings"></div></div>

        <!-- Máy bay bay ngang -->
        <div class="airplane">✈️</div>

        <!-- TRANG CHỦ -->
        <div id="home-screen">
            <h1>THẾ GIỚI CỦA TÔI</h1>
            <p>Hello xin chào! Đã tới với thế giới game độc quyền đỉnh cao lớp 8.</p>

            <!-- Nút bấm chữ OPEN duy nhất -->
            <button class="btn-open" onclick="goToCharacterSelect()">OPEN</button>
        </div>

        <!-- TRANG CHỌN NHÂN VẬT -->
        <div id="char-screen">
            <h2>CHỌN NHÂN VẬT</h2>
            
            <div class="char-container">
                <!-- Nhân vật 1 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat1.png" alt="Lực sĩ" class="body-img">
                        <img src="khuonmat1.png" alt="Mặt 1" class="face-animated face-char1">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Lực Sĩ')">CHỌN</button>
                </div>

                <!-- Nhân vật 2 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat2.png" alt="Nghèo khổ" class="body-img">
                        <img src="khuonmat2.png" alt="Mặt 2" class="face-animated face-char2">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Đói Khổ')">CHỌN</button>
                </div>
            </div>
            
            <p style="font-size: 12px; color: #fff; font-weight: bold;">Chạm nút CHỌN bên dưới để bắt đầu!</p>
        </div>
    </div>

    <script>
        function goToCharacterSelect() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('char-screen').style.display = 'flex';
        }

        function selectChar(charName) {
            alert("Bạn đã chọn: " + charName + "! Game chuẩn bị khởi chạy...");
        }
    </script>
</body>
</html>
