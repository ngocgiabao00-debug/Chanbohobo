<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thế Giới Game Độc Lạ - Lớp 8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b132b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* KHUNG GAME CHÍNH TRÊN ĐIỆN THOẠI */
        .container {
            width: 100%;
            max-width: 380px;
            height: 650px;
            border-radius: 20px;
            border: 3px solid #00fff0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,255,240,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- 1. BACKGROUND NỀN (File: background.png) --- */
        .view-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('background.png'); 
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* --- 2. ĐÁM MÂY (File: cloud1.png & cloud2.png - Tự động lọc bỏ nền thừa) --- */
        .cloud-base {
            position: absolute;
            z-index: 2;
            height: auto;
            object-fit: contain;
            opacity: 0.9;
            mix-blend-mode: screen; /* Tự động làm biến mất phần nền trắng/xanh của ảnh mây */
            animation: moveCloud linear infinite;
        }
        .cloud-img1 {
            width: 90px;
            top: 40px;
            left: -120px;
            animation-duration: 15s;
        }
        .cloud-img2 {
            width: 110px;
            top: 95px;
            left: -140px;
            animation-duration: 20s;
            animation-delay: 3s;
        }
        @keyframes moveCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(520px); }
        }

        /* --- 3. MÁY BAY 3D/4D BAY XÉO QUA ĐẦU (File: airplanes.png) --- */
        .airplane-wrapper {
            position: absolute;
            bottom: -50px;
            left: -80px;
            z-index: 4;
            display: flex;
            align-items: center;
            transform-origin: bottom left;
            animation: fly3DPlane 9s ease-in-out infinite;
        }
        .airplanes-img {
            width: 75px;
            height: auto;
            object-fit: contain;
            image-rendering: pixelated;
        }
        /* Vệt khói trắng phản lực phía sau máy bay */
        .smoke-trail {
            width: 95px;
            height: 8px;
            background: linear-gradient(to left, rgba(255,255,255,0.95), rgba(255,255,255,0.2) 60%, transparent);
            border-radius: 5px;
            margin-right: -4px;
            filter: blur(1.2px);
        }
        @keyframes fly3DPlane {
            0% {
                transform: translate(0, 0) scale(0.4) rotate(25deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translate(380px, -450px) scale(1.4) rotate(-10deg);
                opacity: 0;
            }
        }

        /* --- 4. CHIM BAY (File: bird.gif - Đã xoay đúng hướng) --- */
        .bird-obj {
            position: absolute;
            width: 38px;
            height: auto;
            z-index: 4;
            transform: scaleX(-1);
            animation: flyBirdPath 8s linear infinite;
        }
        .bird-pos1 { top: 110px; left: -50px; animation-delay: 0s; }
        .bird-pos2 { top: 170px; left: -50px; animation-delay: 4s; }
        @keyframes flyBirdPath {
            0% { transform: scaleX(-1) translateX(0) translateY(0); }
            50% { transform: scaleX(-1) translateX(-230px) translateY(-20px); }
            100% { transform: scaleX(-1) translateX(-470px) translateY(0); }
        }

        /* --- NỘI DUNG GIAO DIỆN TRANG CHỦ & CHỌN NHÂN VẬT --- */
        #home-screen, #char-screen {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
        }

        #home-screen h1 {
            font-size: 26px;
            color: #00fff0;
            margin-bottom: 15px;
            text-shadow: 0 2px 6px #000;
        }
        #home-screen p {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 35px;
            line-height: 1.5;
            text-shadow: 0 2px 4px #000;
        }
        .btn-open {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.5);
        }
        .btn-open:active {
            transform: scale(0.95);
        }

        /* MÀN HÌNH CHỌN NHÂN VẬT */
        #char-screen {
            display: none;
        }
        #char-screen h2 {
            font-size: 22px;
            color: #ffeb3b;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px #000;
        }
        .char-container {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-bottom: 15px;
        }
        .char-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00fff0;
            border-radius: 12px;
            width: 48%;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-box {
            position: relative;
            width: 100px;
            height: 140px;
            margin-bottom: 10px;
        }
        .body-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Hiệu ứng đầu nhân vật lắc lư */
        @keyframes headShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }
        .face-animated {
            position: absolute;
            animation: headShake 2.5s ease-in-out infinite;
            transform-origin: bottom center;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .face-char1 { top: 12px; left: 28px; width: 44px; height: 44px; }
        .face-char2 { top: 18px; left: 28px; width: 44px; height: 44px; }

        .btn-select {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. BACKGROUND NỀN -->
        <div class="view-bg"></div>
        
        <!-- 2. HAI ĐÁM MÂY (cloud1.png và cloud2.png) -->
        <img src="cloud1.png" alt="Mây 1" class="cloud-base cloud-img1">
        <img src="cloud2.png" alt="Mây 2" class="cloud-base cloud-img2">

        <!-- 3. MÁY BAY 3D/4D (airplanes.png) -->
        <div class="airplane-wrapper">
            <div class="smoke-trail"></div>
            <img src="airplanes.png" alt="Phi đội máy bay" class="airplanes-img">
        </div>

        <!-- 4. CHIM BAY (bird.gif) -->
        <img src="bird.gif" alt="Chim bay" class="bird-obj bird-pos1">
        <img src="bird.gif" alt="Chim bay" class="bird-obj bird-pos2">

        <!-- TRANG CHỦ -->
        <div id="home-screen">
            <h1>THẾ GIỚI CỦA TÔI</h1>
            <p>Hello xin chào! Đã tới với thế giới game độc quyền đỉnh cao lớp 8.</p>

            <button class="btn-open" onclick="goToCharacterSelect()">OPEN</button>
        </div>

        <!-- TRANG CHỌN NHÂN VẬT -->
        <div id="char-screen">
            <h2>CHỌN NHÂN VẬT</h2>
            
            <div class="char-container">
                <!-- Nhân vật 1 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat1.png" alt="Lực sĩ" class="body-img">
                        <img src="khuonmat1.png" alt="Mặt 1" class="face-animated face-char1">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Lực Sĩ')">CHỌN</button>
                </div>

                <!-- Nhân vật 2 -->
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat2.png" alt="Nghèo khổ" class="body-img">
                        <img src="khuonmat2.png" alt="Mặt 2" class="face-animated face-char2">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Đói Khổ')">CHỌN</button>
                </div>
            </div>
            
            <p style="font-size: 12px; color: #fff; font-weight: bold;">Chạm nút CHỌN bên dưới để bắt đầu!</p>
        </div>
    </div>

    <script>
        function goToCharacterSelect() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('char-screen').style.display = 'flex';
        }

        function selectChar(charName) {
            alert("Bạn đã chọn: " + charName + "! Game chuẩn bị khởi chạy...");
        }
    </script>
</body>
</html>
